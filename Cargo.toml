# Mirror `[project].name` and `[project].version` in `pyproject.toml`; Maturin uses pyproject metadata as the distribution authority.

[package]
name = "bookette"
version = "4.0.0"
edition = "2021"

[lib]
name = "bookette"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26.0", features = ["extension-module"] }